<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 800" width="400" height="800">
  <defs>
    <linearGradient id="scrub" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2563eb"/>
      <stop offset="1" stop-color="#1e40af"/>
    </linearGradient>
    <linearGradient id="coatGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="0.5" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e2e8f0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- backdrop -->
  <circle cx="200" cy="320" r="210" fill="#eff6ff"/>

  <!-- arms / scrub -->
  <rect x="58" y="210" width="70" height="300" rx="34" fill="url(#scrub)"/>
  <rect x="272" y="210" width="70" height="300" rx="34" fill="url(#scrub)"/>

  <!-- torso scrub -->
  <path d="M120 250 q80 40 160 0 v340 a30 30 0 0 1 -30 30 h-100 a30 30 0 0 1 -30 -30 z" fill="url(#scrub)"/>

  <!-- neck / collars -->
  <rect x="150" y="150" width="100" height="70" rx="28" fill="#1e40af"/>

  <!-- head -->
  <circle cx="200" cy="100" r="58" fill="#fcd5b0"/>
  <path d="M142 110 a58 58 0 0 1 116 0 q0 8 -116 0" fill="#3b2f2f"/>
  <path d="M148 58 a80 60 0 0 1 104 0 l-6 6 q-46 -30 -92 0 z" fill="#0f172a"/>

  <!-- coat: left front -->
  <path d="M120 250 q80 40 160 0 v340 a30 30 0 0 1 -30 30 h-100 a30 30 0 0 1 -30 30 z" fill="none"/>
  <!-- coat panel left -->
  <path d="M96 300 q12 8 24 -14 v260 a30 30 0 0 0 22 28 h-18 a26 26 0 0 1 -26 -26 v-262 l26 14" fill="url(#coatGrad)" filter="url(#shadow)"/>
  <!-- coat panel right -->
  <path d="M304 300 q-12 8 -24 -14 v260 a30 30 0 0 1 -22 28 h18 a26 26 0 0 0 26 -26 v-262 l-26 14" fill="url(#coatGrad)" filter="url(#shadow)"/>

  <!-- coat back between panels -->
  <path d="M120 310 q80 30 160 0 v300 q-80 34 -160 0 z" fill="#ffffff"/>

  <!-- stethoscope -->
  <path d="M200 150 q0 26 -16 40" stroke="#475569" stroke-width="6" fill="none" stroke-linecap="round"/>
  <path d="M148 200 a14 14 0 1 0 28 0 a14 14 0 1 0 -28 0" fill="#475569"/>
  <path d="M128 210 q-6 40 30 56" stroke="#475569" stroke-width="5" fill="none" stroke-linecap="round"/>
  <path d="M272 210 q6 40 -30 56" stroke="#475569" stroke-width="5" fill="none" stroke-linecap="round"/>

  <!-- pocket -->
  <rect x="150" y="470" width="86" height="74" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="3"/>

  <!-- coat collar -->
  <path d="M120 258 q80 34 160 0 l-10 26 q-70 22 -140 0 z" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="2"/>

  <!-- buttons -->
  <circle cx="200" cy="330" r="7" fill="#cbd5e1"/>
  <circle cx="200" cy="380" r="7" fill="#cbd5e1"/>
  <circle cx="200" cy="430" r="7" fill="#cbd5e1"/>

  <!-- base shadow -->
  <ellipse cx="200" cy="660" rx="150" ry="18" fill="#0f172a" opacity="0.08"/>
</svg>